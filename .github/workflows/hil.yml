# The bundle a rig flashes, built here and uploaded as the Actions artifact
# the rig looks for. That is all a rig on a LAN needs: "Get firmware from
# GitHub" on the project's page takes the newest `hil-artifacts` a run of
# this workflow uploaded.
#
# A rig your CI can reach may be handed the bundle directly instead: the
# last step, off by default, needs two repository secrets -- RIG_URL (the
# rig's address) and RIG_KEY (a key of role `user`, made on the rig with
# `alteriom-hil-admin keys create`).
name: HIL
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    name: Build the bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: python -m pip install --quiet platformio esptool
      - run: python scripts/build_bundle.py --out hil-artifacts
      - name: Say what was built
        run: python -c "import json; m = json.load(open('hil-artifacts/manifest.json')); print(m['esp32_rig_example_sha'], sorted(m['targets']))"
      - uses: actions/upload-artifact@v4
        with:
          name: hil-artifacts          # the artifact name the project has on the rig
          path: hil-artifacts          # the bundle directory's contents
          if-no-files-found: error
      - name: Hand the bundle to the rig
        if: github.event_name != 'pull_request' && vars.HAND_OVER_TO_RIG == 'true'
        env:
          RIG_URL: ${{ secrets.RIG_URL }}
          RIG_KEY: ${{ secrets.RIG_KEY }}
        run: |
          set -euo pipefail
          tar -czf bundle.tar.gz hil-artifacts
          curl -fsS -X POST -H "Authorization: Bearer $RIG_KEY" --data-binary @bundle.tar.gz \
            "$RIG_URL/api/v1/artifacts?profile=esp32-rig-example&repo=https://github.com/$GITHUB_REPOSITORY&workflow=.github/workflows/hil.yml&run_id=$GITHUB_RUN_ID&run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID&commit=$GITHUB_SHA"

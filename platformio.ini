; The example firmware, one environment per board family the bundle carries.
; scripts/build_bundle.py runs each and merges what PlatformIO built into
; the one image per family a rig flashes. Add a family by adding an
; environment here and a row to TARGETS in that script.
;
; Platforms are pinned to exact releases so two builds of one commit are
; the same firmware. ESP32-C5 and C6 need Arduino core 3.x (pioarduino's
; platform); see the Alteriom/esp32-hil-firmware platformio.ini for those.

[platformio]
src_dir = src

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -D EXAMPLE_COMMIT=\"${sysenv.EXAMPLE_COMMIT}\"

[esp32_common]
platform = espressif32@7.0.1

; The C3 and S3 devkits talk on their USB-Serial/JTAG socket; the console
; goes there from boot so the rig hears the boot frame.
[native_usb]
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32]
extends = esp32_common
board = esp32dev
build_flags =
    ${env.build_flags}
    -D EXAMPLE_FAMILY=\"esp32\"

[env:esp32-c3]
extends = esp32_common
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    ${native_usb.build_flags}
    -D EXAMPLE_FAMILY=\"esp32-c3\"

[env:esp32-s3]
extends = esp32_common
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    ${native_usb.build_flags}
    -D EXAMPLE_FAMILY=\"esp32-s3\"

[env:esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2
build_flags =
    ${env.build_flags}
    -D EXAMPLE_FAMILY=\"esp8266\"
